name: krisha-tracker

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick — свежие объявления, full — вся выдача"
        type: choice
        options: [full, quick]
        default: full

concurrency:
  group: krisha-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        run: python tracker.py
        env:
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 22 * * *' && 'full' || 'quick') }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DEBUG_DIR: debug_html

      - name: Save debug HTML if parsing failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_html/
          if-no-files-found: ignore
